name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: web
        run: bun run typecheck
      - name: Canvas tests
        working-directory: web
        run: node --test src/lib/canvas/*.test.mjs
      - name: Build
        working-directory: web
        run: bun run build

  canvas-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: canvas-agent/package-lock.json
      - name: Install dependencies
        working-directory: canvas-agent
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: canvas-agent
        run: npm test
      - name: Build
        working-directory: canvas-agent
        run: npm run build

  agent-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agent-service/package-lock.json
      - name: Install dependencies
        working-directory: agent-service
        run: npm ci --no-audit --no-fund
      - name: Test
        working-directory: agent-service
        run: npm test
      - name: Build
        working-directory: agent-service
        run: npm run build

  asset-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: asset-server/go.mod
      - name: Test
        working-directory: asset-server
        run: go test ./...

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        working-directory: docs
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: docs
        run: bun run types:check
      - name: Build
        working-directory: docs
        run: bun run build

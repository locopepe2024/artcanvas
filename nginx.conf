server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /api/video-assets {
        client_max_body_size 201m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /video-assets/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    # 仅代理 UniArt 自有视频缓存目录，供浏览器同源下载和 Range 播放。
    location ^~ /api/video-result-proxy/ {
        proxy_pass https://storage.iyishow.com/uniart-cache/;
        proxy_ssl_server_name on;
        proxy_ssl_name storage.iyishow.com;
        proxy_set_header Host storage.iyishow.com;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    # 浏览器把 Unitoken 交给 Canvas 同源服务；服务端访问 UniArt /content，并在 CDN 跳转前移除 Token。
    location ^~ /api/video-content-proxy/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 运行期配置由容器启动时生成，禁止缓存，确保改环境变量后即时生效。
    location = /config.js {
        add_header Cache-Control "no-store";
    }
}
